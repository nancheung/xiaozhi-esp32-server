[project]
name = "xiaozhi-core"
version = "0.1.0"
description = "小智服务端领域核心：六边形架构 + 事件驱动的语音对话编排引擎"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
llm = ["litellm>=1.40"]
server = ["fastapi>=0.111", "uvicorn[standard]>=0.30"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xiaozhi_core"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
# 中文注释/文档使用全角标点，禁用歧义 Unicode 字符检查
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
